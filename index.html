<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GYM Walter</title>
<style>
:root{--bg:#0b1020;--card:#161d32;--card2:#202944;--accent:#b9ff38;--text:#f7f8fb;--muted:#aeb7cc;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#080c18,#121a30);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#0b1020e8;backdrop-filter:blur(12px);padding:18px 16px 12px;border-bottom:1px solid #26304b}h1{font-size:23px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:680px;margin:auto;padding:16px 16px 95px}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0a0f1de8;backdrop-filter:blur(12px);border-top:1px solid #28304a;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}
.tabs button{width:25%;max-width:220px;border:0;background:none;color:var(--muted);padding:9px 5px;font-weight:700}.tabs button.active{color:var(--accent)}
.day,.card{background:var(--card);border:1px solid #27304c;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 12px 30px #0003}.day h2,.card h3{margin:0 0 6px}.pill{display:inline-block;background:#26314d;border-radius:99px;padding:5px 9px;color:#d6dded;font-size:12px;margin:2px 4px 2px 0}.primary,.secondary,.danger{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:15px}.primary{background:var(--accent);color:#111827}.secondary{background:#293451;color:white}.danger{background:#4b2430;color:#ffd6d6}.wide{width:100%;margin-top:10px}.exercise{border-top:1px solid #303a58;padding:15px 0}.exercise:first-of-type{border-top:0}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.machine{color:var(--accent);font-weight:800;font-size:13px}.set{display:grid;grid-template-columns:50px 1fr 1fr 44px;gap:7px;align-items:center;margin-top:8px}.set input{width:100%;background:#0f1628;color:white;border:1px solid #35415f;border-radius:10px;padding:10px;font-size:16px}.check{width:38px;height:38px;border-radius:10px;border:1px solid #4d5a7c;background:#202a44;color:white;font-size:18px}.check.done{background:var(--accent);color:#0b1020}.small{font-size:12px;color:var(--muted)}.hidden{display:none}.history-item{padding:12px 0;border-top:1px solid #303a58}.history-item:first-child{border-top:0}.empty{text-align:center;color:var(--muted);padding:30px 5px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:start}.done-badge{color:var(--accent);font-weight:800}.notice{background:#25304b;border-left:4px solid var(--accent);padding:12px;border-radius:10px;margin-bottom:14px;color:#e5e9f2}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM Walter">
<link rel="apple-touch-icon" href="icon-180.png">
</head><body>
<header><h1>GYM Walter 💪</h1><div class="sub" id="subtitle">4 días de gym + miércoles activo</div></header>
<main>
<section id="home"></section>
<section id="workout" class="hidden"></section>
<section id="progress" class="hidden"></section><section id="history" class="hidden"></section>
</main>
<nav class="tabs"><button data-tab="home" class="active">🏠<br>Rutinas</button><button data-tab="workout">🔥<br>Entreno</button><button data-tab="progress">🏆<br>Progreso</button><button data-tab="history">📋<br>Historial</button></nav>
<script>
'use strict';
function storeGet(k, fallback){try{var v=window.localStorage.getItem(k);return v===null?fallback:v}catch(e){return fallback}}
function storeSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}
function storeRemove(k){try{window.localStorage.removeItem(k)}catch(e){}}

const routines=[
{name:'Día 1',focus:'Hombros, pecho y tríceps',exercises:[
{name:'Press militar máquina',sets:3,reps:'8 a 12',machine:'6'},
{name:'Aperturas Peck Deck',sets:3,reps:'10 a 15',machine:'49'},
{name:'Vuelos laterales',sets:4,reps:'10 a 15',machine:'—'},
{name:'Tríceps en polea',sets:3,reps:'8 a 12',machine:'—'}]},
{name:'Día 2',focus:'Espalda y bíceps',exercises:[
{name:'Remo en máquina',sets:4,reps:'8 a 12',machine:'45'},
{name:'Jalón al pecho',sets:4,reps:'8 a 12',machine:'56'},
{name:'Remo bajo neutro',sets:3,reps:'8 a 12',machine:'57'},
{name:'Bíceps con barra',sets:4,reps:'8 a 12',machine:'—'},
{name:'Bíceps en banco Scott',sets:3,reps:'10 a 15',machine:'—'}]},
{name:'Día 3',focus:'Piernas y pecho',exercises:[
{name:'Prensa 45°',sets:4,reps:'8 a 12',machine:'21'},
{name:'Flexora acostado',sets:3,reps:'8 a 12',machine:'54'},
{name:'Extensora',sets:3,reps:'10 a 15',machine:'52'},
{name:'Abductor',sets:4,reps:'10 a 12',machine:'42'},
{name:'Gemelos sentado',sets:4,reps:'10 a 15',machine:'2'},
{name:'Press horizontal',sets:4,reps:'8 a 12',machine:'12'}]}
];
const mem={};
function storageGet(k, fallback){try{const v=storeGet(k);return v===null?fallback:v}catch(e){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:fallback}}
function storageSet(k,v){try{storeSet(k,v)}catch(e){mem[k]=v}}
function storageRemove(k){try{storeRemove(k)}catch(e){delete mem[k]}}
function safeParse(s,fallback){try{return JSON.parse(s)}catch(e){return fallback}}
let session=safeParse(storageGet('walterActive','null'),null);
const histories=()=>safeParse(storageGet('walterHistory','[]'),[]);
function saveSession(){storageSet('walterActive',JSON.stringify(session))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function activities(){return safeParse(storageGet('walterActivities','[]'),[])}
function saveActive(){let min=document.getElementById('activeMinutes').value,km=document.getElementById('activeKm').value;if(!min&&!km){alert('Ingresá los minutos o kilómetros.');return}let a=activities();a.unshift({date:new Date().toISOString(),minutes:min,km:km});storageSet('walterActivities',JSON.stringify(a));alert('Miércoles activo guardado 🐾');renderProgress()}
function renderHome(){document.getElementById('home').innerHTML='<div class="notice">Plan semanal: gimnasio lunes, martes, jueves y viernes; miércoles activo con Coffe. Los datos quedan guardados en este dispositivo.</div>'+`<article class="day"><div class="topline"><div><h2>Miércoles activo 🐾</h2><div class="small">Caminata o carrera con Coffe</div></div><span class="pill">Actividad</span></div><div class="set" style="grid-template-columns:1fr 1fr"><input id="activeMinutes" inputmode="numeric" placeholder="minutos"><input id="activeKm" inputmode="decimal" placeholder="kilómetros"></div><button class="secondary wide" onclick="saveActive()">Guardar miércoles activo</button></article>`+routines.map((d,i)=>`<article class="day"><div class="topline"><div><h2>${d.name}</h2><div class="small">${d.focus}</div></div><span class="pill">${d.exercises.length} ejercicios</span></div><p>${d.exercises.map(x=>`<span class="pill">${x.name}</span>`).join('')}</p><button class="primary wide" onclick="start(${i})">Empezar ${d.name}</button></article>`).join('')}
function lastFor(name){for(const h of histories()){const e=h.exercises.find(x=>x.name===name);if(e)return e}return null}
function localDateValue(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function setSessionDate(v){if(session){session.selectedDate=v;saveSession()}}
function start(i){if(session&&!confirm('Ya hay un entrenamiento sin finalizar. ¿Querés reemplazarlo?'))return;const d=routines[i];session={day:d.name,started:new Date().toISOString(),selectedDate:localDateValue(new Date()),exercises:d.exercises.map(e=>({...e,entries:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};saveSession();switchTab('workout')}
function update(ei,si,key,val){session.exercises[ei].entries[si][key]=val;saveSession()}
function toggle(ei,si){let x=session.exercises[ei].entries[si];x.done=!x.done;saveSession();renderWorkout()}
function renderWorkout(){if(!session){document.getElementById('workout').innerHTML='<div class="empty">No hay un entrenamiento activo.<br>Elegí un día en Rutinas.</div>';return}document.getElementById('workout').innerHTML=`<article class="card"><div class="topline"><div><h3>${session.day}</h3><div class="small">Ingresá los kilos y las repeticiones de cada serie.</div><label class="small" style="display:block;margin-top:12px">Fecha del entrenamiento</label><input type="date" max="${localDateValue(new Date())}" value="${session.selectedDate||localDateValue(new Date(session.started))}" onchange="setSessionDate(this.value)" style="margin-top:5px;background:#0f1628;color:white;border:1px solid #35415f;border-radius:10px;padding:10px;font-size:16px"></div><button class="danger" onclick="cancelSession()">Cancelar</button></div>${session.exercises.map((e,ei)=>{let last=lastFor(e.name);return `<div class="exercise"><div class="row"><div class="grow"><strong>${e.name}</strong><div class="small">Objetivo: ${e.sets} series · ${e.reps} repeticiones</div></div><div class="machine">Máq. ${e.machine}</div></div>${last?`<div class="small" style="margin-top:7px">Última vez: ${last.entries.map(s=>`${s.weight||'–'} kg × ${s.reps||'–'}`).join(' · ')}</div>`:''}${e.entries.map((s,si)=>`<div class="set"><span class="small">Serie ${si+1}</span><input inputmode="decimal" placeholder="kg" value="${esc(s.weight)}" onchange="update(${ei},${si},'weight',this.value)"><input inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" onchange="update(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggle(${ei},${si})">${s.done?'✓':'○'}</button></div>`).join('')}</div>`}).join('')}<button class="primary wide" onclick="finish()">Finalizar y guardar entrenamiento</button></article>`}
function finish(){if(!session)return;const filled=session.exercises.some(e=>e.entries.some(s=>s.weight||s.reps));if(!filled){alert('Ingresá al menos un peso o una repetición antes de guardar.');return}const h=histories();let chosen=session.selectedDate||localDateValue(new Date());let sessionDate=new Date(chosen+'T12:00:00');h.unshift({...session,started:sessionDate.toISOString(),finished:sessionDate.toISOString(),savedAt:new Date().toISOString()});storageSet('walterHistory',JSON.stringify(h));storageRemove('walterActive');session=null;renderWorkout();renderHistory();renderProgress();switchTab('progress')}
function cancelSession(){if(confirm('¿Cancelar el entrenamiento actual?')){session=null;storageRemove('walterActive');renderWorkout();switchTab('home')}}
function validDate(x){let d=new Date(x.finished||x.started);return isNaN(d)?null:d}
function weekKey(d){let x=new Date(d);x.setHours(0,0,0,0);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}
function stats(){const h=histories().filter(validDate);const weeks={};h.forEach(x=>{let k=weekKey(validDate(x));weeks[k]=(weeks[k]||0)+1});let keys=Object.keys(weeks).sort().reverse(),streak=0;if(keys.length){let cursor=new Date(keys[0]);while(weeks[cursor.toISOString().slice(0,10)]>=4){streak++;cursor.setDate(cursor.getDate()-7)}}
let records={},series={};h.slice().reverse().forEach(x=>x.exercises.forEach(e=>e.entries.forEach(z=>{let w=parseFloat(String(z.weight).replace(',','.')),r=parseInt(z.reps);if(!isNaN(w)){records[e.name]=Math.max(records[e.name]||0,w);(series[e.name]??=[]).push({date:validDate(x),weight:w,reps:isNaN(r)?0:r})}})));return {h,weeks,streak,records,series}}
function achievements(st){let a=[['🥉','Primer entrenamiento',st.h.length>=1],['🔥','Primera semana completa',Object.values(st.weeks).some(n=>n>=4)],['💪','10 entrenamientos',st.h.length>=10],['🏆','Primer récord registrado',Object.keys(st.records).length>=1],['🥇','4 semanas cumplidas',Object.values(st.weeks).filter(n=>n>=4).length>=4]];return a}
function renderProgress(){let st=stats(),acts=activities(),rec=Object.entries(st.records).sort((a,b)=>b[1]-a[1]);let ach=achievements(st);let latestWeek=weekKey(new Date()),thisWeek=st.weeks[latestWeek]||0;document.getElementById('progress').innerHTML=`<article class="card"><h3>🔥 Racha</h3><div style="font-size:34px;font-weight:900;color:var(--accent)">${st.streak} semana${st.streak===1?'':'s'}</div><div class="small">Semanas consecutivas cumpliendo 4 entrenamientos de gym</div><div style="margin-top:12px;background:#0f1628;border-radius:99px;overflow:hidden"><div style="width:${Math.min(100,thisWeek/4*100)}%;height:12px;background:var(--accent)"></div></div><div class="small" style="margin-top:6px">Esta semana: ${thisWeek} / 4</div></article><article class="card"><h3>🐾 Miércoles activo</h3>${acts.length?acts.slice(0,6).map(a=>`<div class="history-item"><b>${new Date(a.date).toLocaleDateString('es-UY')}</b><span style="float:right">${a.minutes?a.minutes+' min ':''}${a.km?a.km+' km':''}</span></div>`).join(''):'<div class="empty">Todavía no registraste caminatas o carreras.</div>'}</article><article class="card"><h3>🏆 Récords personales</h3>${rec.length?rec.map(([n,w])=>`<div class="history-item"><b>${n}</b><span style="float:right;color:var(--accent);font-weight:900">${w} kg</span></div>`).join(''):'<div class="empty">Guardá entrenamientos para generar récords.</div>'}</article><article class="card"><h3>📈 Gráficos</h3>${Object.entries(st.series).filter(([n,v])=>v.length>1).map(([n,v])=>chart(n,v)).join('')||'<div class="empty">Necesitás al menos dos registros de peso en un ejercicio.</div>'}</article><article class="card"><h3>🏅 Logros</h3>${ach.map(x=>`<div class="history-item" style="opacity:${x[2]?1:.4}"><span style="font-size:26px">${x[0]}</span> <b>${x[1]}</b><span style="float:right">${x[2]?'✅':'🔒'}</span></div>`).join('')}</article>`}
function chart(name,v){let last=v.slice(-8),max=Math.max(...last.map(x=>x.weight)),min=Math.min(...last.map(x=>x.weight)),range=max-min||1;let pts=last.map((x,i)=>`${10+i*(280/Math.max(1,last.length-1))},${105-(x.weight-min)/range*80}`).join(' ');return `<div class="exercise"><b>${name}</b><svg viewBox="0 0 300 125" style="width:100%;margin-top:8px;background:#0f1628;border-radius:12px"><polyline points="${pts}" fill="none" stroke="#b9ff38" stroke-width="4"/>${last.map((x,i)=>`<circle cx="${10+i*(280/Math.max(1,last.length-1))}" cy="${105-(x.weight-min)/range*80}" r="5" fill="#b9ff38"></circle>`).join('')}<text x="8" y="120" fill="#aeb7cc" font-size="11">${last[0].weight} kg</text><text x="245" y="120" fill="#aeb7cc" font-size="11">${last[last.length-1].weight} kg</text></svg></div>`}
function renderHistory(){const h=histories();document.getElementById('history').innerHTML=h.length?`<article class="card"><div class="topline"><div><h3>Historial</h3><div class="small">${h.length} entrenamiento${h.length===1?'':'s'} guardado${h.length===1?'':'s'}</div></div><button class="danger" onclick="clearHistory()">Borrar</button></div>${h.map(x=>`<div class="history-item"><div class="topline"><strong>${x.day}</strong><span class="done-badge">✓ Guardado</span></div><div class="small">${new Date(x.finished).toLocaleString('es-UY',{dateStyle:'medium',timeStyle:'short'})}</div>${x.exercises.map(e=>`<div style="margin-top:9px"><b>${e.name}</b><div class="small">${e.entries.map((s,i)=>`S${i+1}: ${s.weight||'–'} kg × ${s.reps||'–'}`).join(' · ')}</div></div>`).join('')}</div>`).join('')}</article>`:'<div class="empty">Todavía no guardaste entrenamientos.</div>'}
function clearHistory(){if(confirm('¿Borrar todo el historial? Esta acción no se puede deshacer.')){storageRemove('walterHistory');renderHistory()}}
function safeRun(fn){try{fn()}catch(e){console.log('GYM app:',e&&e.message?e.message:e)}}
function switchTab(id){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='workout')safeRun(renderWorkout);if(id==='progress')safeRun(renderProgress);if(id==='history')safeRun(renderHistory)}
const home=document.getElementById('home'), workout=document.getElementById('workout'), history=document.getElementById('history');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));safeRun(renderHome);safeRun(renderWorkout);safeRun(renderHistory);
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function () {});
  });
}
</script>
</body></html>
