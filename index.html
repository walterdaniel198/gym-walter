<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GYM Walter</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GYM Walter"><link rel="apple-touch-icon" href="icon-180.png"><style>
:root{--bg:#0b1020;--card:#161d32;--accent:#b9ff38;--text:#fff;--muted:#aeb7cc}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--text);font-family:system-ui,-apple-system,sans-serif}header{padding:18px 16px;border-bottom:1px solid #27304c;position:sticky;top:0;background:#0b1020;z-index:3}h1{margin:0;font-size:23px}.sub,.small{color:var(--muted);font-size:13px}main{max-width:680px;margin:auto;padding:16px 16px 95px}.card{background:var(--card);border:1px solid #27304c;border-radius:18px;padding:16px;margin-bottom:13px}.pill{display:inline-block;background:#26314d;border-radius:99px;padding:5px 9px;font-size:12px;margin:3px}.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px;font-weight:800}.primary{background:var(--accent);color:#111}.secondary{background:#293451;color:#fff}.danger{background:#4b2430;color:#ffd6d6}.wide{width:100%;margin-top:10px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0a0f1d;display:flex;border-top:1px solid #27304c}.tabs button{width:25%;padding:10px 3px;border:0;background:none;color:var(--muted);font-weight:700}.tabs .active{color:var(--accent)}.hidden{display:none}.exercise,.history-item{border-top:1px solid #303a58;padding:13px 0}.set{display:grid;grid-template-columns:50px 1fr 1fr 42px;gap:7px;align-items:center;margin-top:8px}input{width:100%;background:#0f1628;color:#fff;border:1px solid #35415f;border-radius:9px;padding:10px;font-size:16px}.check{height:39px;border-radius:9px;border:1px solid #4d5a7c;background:#202a44;color:#fff}.check.done{background:var(--accent);color:#111}.row,.topline{display:flex;gap:10px;align-items:center;justify-content:space-between}.machine{color:var(--accent);font-weight:800}.bar{height:12px;background:#0f1628;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}svg{width:100%;background:#0f1628;border-radius:10px;margin-top:8px}
</style></head><body><header><h1>GYM Walter 💪</h1><div class="sub">4 días de gym + miércoles activo</div></header><main><section id="home"></section><section id="workout" class="hidden"></section><section id="progress" class="hidden"></section><section id="history" class="hidden"></section></main><nav class="tabs"><button data-tab="home" class="active">🏠<br>Rutinas</button><button data-tab="workout">🔥<br>Entreno</button><button data-tab="progress">🏆<br>Progreso</button><button data-tab="history">📋<br>Historial</button></nav><script>
'use strict';
const routines=[
{name:'Día 1',focus:'Pecho, hombros y tríceps',exercises:[{name:'Press horizontal',sets:4,reps:'8 a 12',machine:'12'},{name:'Press militar máquina',sets:3,reps:'8 a 12',machine:'6'},{name:'Aperturas Peck Deck',sets:3,reps:'10 a 15',machine:'49'},{name:'Vuelos laterales',sets:4,reps:'10 a 15',machine:'—'},{name:'Tríceps en polea',sets:3,reps:'8 a 12',machine:'—'}]},
{name:'Día 2',focus:'Espalda y bíceps',exercises:[{name:'Remo en máquina',sets:4,reps:'8 a 12',machine:'45'},{name:'Jalón al pecho',sets:4,reps:'8 a 12',machine:'56'},{name:'Remo bajo neutro',sets:3,reps:'8 a 12',machine:'57'},{name:'Bíceps con barra',sets:4,reps:'8 a 12',machine:'—'},{name:'Bíceps en banco Scott',sets:3,reps:'10 a 15',machine:'—'}]},
{name:'Día 3',focus:'Piernas',exercises:[{name:'Prensa 45°',sets:4,reps:'8 a 12',machine:'21'},{name:'Flexora acostado',sets:3,reps:'8 a 12',machine:'54'},{name:'Extensora',sets:3,reps:'10 a 15',machine:'52'},{name:'Abductor',sets:4,reps:'10 a 12',machine:'42'},{name:'Gemelos sentado',sets:4,reps:'10 a 15',machine:'2'}]}];
const get=(k,d)=>{try{let v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del=k=>{try{localStorage.removeItem(k)}catch(e){}};const parse=(v,d)=>{try{return JSON.parse(v)}catch(e){return d}};let session=parse(get('walterActive','null'),null);const histories=()=>parse(get('walterHistory','[]'),[]),activities=()=>parse(get('walterActivities','[]'),[]);function dateVal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function save(){set('walterActive',JSON.stringify(session))}
function renderHome(){document.getElementById('home').innerHTML=`<div class="card"><b>Plan semanal</b><div class="small">Gym lunes, martes, jueves y viernes. Miércoles activo con Coffe 🐾</div><div class="set" style="grid-template-columns:1fr 1fr"><input id="mins" inputmode="numeric" placeholder="minutos"><input id="kms" inputmode="decimal" placeholder="kilómetros"></div><button class="secondary wide" onclick="saveActive()">Guardar miércoles activo</button></div>`+routines.map((d,i)=>`<div class="card"><h2>${d.name}</h2><div class="small">${d.focus}</div><p>${d.exercises.map(e=>`<span class="pill">${e.name}</span>`).join('')}</p><button class="primary wide" onclick="start(${i})">Empezar ${d.name}</button></div>`).join('')}
function saveActive(){let m=document.getElementById('mins').value,k=document.getElementById('kms').value;if(!m&&!k)return alert('Ingresá minutos o kilómetros.');let a=activities();a.unshift({date:new Date().toISOString(),minutes:m,km:k});set('walterActivities',JSON.stringify(a));alert('Miércoles activo guardado 🐾')}
function start(i){if(session&&!confirm('Hay un entrenamiento sin finalizar. ¿Reemplazarlo?'))return;let d=routines[i];session={day:d.name,selectedDate:dateVal(new Date()),started:new Date().toISOString(),exercises:d.exercises.map(e=>Object.assign({},e,{entries:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};save();tab('workout')}
function last(name){for(let h of histories()){let e=h.exercises.find(x=>x.name===name);if(e)return e}return null}function upd(e,s,k,v){session.exercises[e].entries[s][k]=v;save()}function tog(e,s){session.exercises[e].entries[s].done=!session.exercises[e].entries[s].done;save();renderWorkout()}
function renderWorkout(){let el=document.getElementById('workout');if(!session){el.innerHTML='<div class="card">No hay entrenamiento activo.</div>';return}el.innerHTML=`<div class="card"><div class="topline"><div><h2>${session.day}</h2><label class="small">Fecha del entrenamiento</label><input type="date" max="${dateVal(new Date())}" value="${session.selectedDate}" onchange="session.selectedDate=this.value;save()"></div><button class="danger" onclick="cancelW()">Cancelar</button></div>${session.exercises.map((e,ei)=>{let l=last(e.name);return `<div class="exercise"><div class="topline"><b>${e.name}</b><span class="machine">Máq. ${e.machine}</span></div><div class="small">${e.sets} series · ${e.reps} reps${l?' · última: '+l.entries.map(x=>(x.weight||'–')+'kg×'+(x.reps||'–')).join(' / '):''}</div>${e.entries.map((x,si)=>`<div class="set"><span class="small">S${si+1}</span><input inputmode="decimal" placeholder="kg" value="${x.weight}" onchange="upd(${ei},${si},'weight',this.value)"><input inputmode="numeric" placeholder="reps" value="${x.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="check ${x.done?'done':''}" onclick="tog(${ei},${si})">${x.done?'✓':'○'}</button></div>`).join('')}</div>`}).join('')}<button class="primary wide" onclick="finish()">Finalizar y guardar</button></div>`}
function finish(){if(!session)return;let has=session.exercises.some(e=>e.entries.some(x=>x.weight||x.reps));if(!has)return alert('Ingresá al menos un peso o repetición.');let h=histories(),d=new Date((session.selectedDate||dateVal(new Date()))+'T12:00:00');h.unshift(Object.assign({},session,{started:d.toISOString(),finished:d.toISOString(),savedAt:new Date().toISOString()}));set('walterHistory',JSON.stringify(h));del('walterActive');session=null;renderAll();tab('progress')}function cancelW(){if(confirm('¿Cancelar entrenamiento?')){session=null;del('walterActive');renderAll();tab('home')}}
function weekKey(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return dateVal(x)}function stats(){let h=histories(),weeks={},records={},series={};h.forEach(x=>{let d=new Date(x.finished||x.started);weeks[weekKey(d)]=(weeks[weekKey(d)]||0)+1;x.exercises.forEach(e=>e.entries.forEach(z=>{let w=parseFloat(String(z.weight).replace(',','.'));if(!isNaN(w)){records[e.name]=Math.max(records[e.name]||0,w);(series[e.name]||(series[e.name]=[])).push({date:d,weight:w})}}))});Object.values(series).forEach(a=>a.sort((a,b)=>a.date-b.date));return{h,weeks,records,series}}
function renderProgress(){let s=stats(),wk=s.weeks[weekKey(new Date())]||0,rec=Object.entries(s.records);document.getElementById('progress').innerHTML=`<div class="card"><h2>🔥 Semana</h2><div style="font-size:30px;font-weight:900;color:var(--accent)">${wk} / 4</div><div class="bar"><div style="width:${Math.min(100,wk/4*100)}%"></div></div></div><div class="card"><h2>🏆 Récords</h2>${rec.length?rec.map(x=>`<div class="history-item"><b>${x[0]}</b><span style="float:right;color:var(--accent)">${x[1]} kg</span></div>`).join(''):'<div class="small">Todavía sin registros.</div>'}</div><div class="card"><h2>📈 Progreso</h2>${Object.entries(s.series).filter(x=>x[1].length>1).map(x=>chart(x[0],x[1])).join('')||'<div class="small">Necesitás dos registros del mismo ejercicio.</div>'}</div><div class="card"><h2>🏅 Logros</h2>${[['🥉 Primer entrenamiento',s.h.length>=1],['🔥 Semana completa',Object.values(s.weeks).some(n=>n>=4)],['💪 10 entrenamientos',s.h.length>=10],['🏆 Primer récord',rec.length>0],['🥇 4 semanas completas',Object.values(s.weeks).filter(n=>n>=4).length>=4]].map(a=>`<div class="history-item" style="opacity:${a[1]?1:.4}">${a[0]} <span style="float:right">${a[1]?'✅':'🔒'}</span></div>`).join('')}</div><div class="card"><h2>🐾 Miércoles activo</h2>${activities().slice(0,6).map(a=>`<div class="history-item">${new Date(a.date).toLocaleDateString('es-UY')} <span style="float:right">${a.minutes?a.minutes+' min ':''}${a.km?a.km+' km':''}</span></div>`).join('')||'<div class="small">Sin actividades todavía.</div>'}</div>`}
function chart(n,a){let v=a.slice(-8),mx=Math.max(...v.map(x=>x.weight)),mn=Math.min(...v.map(x=>x.weight)),r=mx-mn||1,p=v.map((x,i)=>(10+i*(280/Math.max(1,v.length-1)))+','+(105-(x.weight-mn)/r*80)).join(' ');return `<div class="exercise"><b>${n}</b><svg viewBox="0 0 300 120"><polyline points="${p}" fill="none" stroke="#b9ff38" stroke-width="4"/></svg></div>`}
function renderHistory(){let h=histories();document.getElementById('history').innerHTML=`<div class="card"><h2>Historial</h2>${h.length?h.map(x=>`<div class="history-item"><b>${x.day}</b> · ${new Date(x.finished||x.started).toLocaleDateString('es-UY')}<div class="small">${x.exercises.map(e=>e.name+': '+e.entries.map(z=>(z.weight||'–')+'kg×'+(z.reps||'–')).join(', ')).join('<br>')}</div></div>`).join(''):'<div class="small">Todavía no hay entrenamientos guardados.</div>'}</div>`}
function tab(id){document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='workout')renderWorkout();if(id==='progress')renderProgress();if(id==='history')renderHistory()}function renderAll(){renderHome();renderWorkout();renderProgress();renderHistory()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));renderAll();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
